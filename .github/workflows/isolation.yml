name: isolation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lib/sandbox.js'
      - 'src/lib/repro.js'
      - 'src/lib/bootstrap.js'
      - 'src/lib/confine.js'

permissions:
  contents: read

jobs:
  docker-and-ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff and check the container runtime
        run: |
          python -m pip install --disable-pip-version-check ruff
          ruff --version
          docker info
      - name: Run the full suite with Docker and ruff
        env:
          ARW_DOCKER_TESTS: '1'
        run: |
          set -o pipefail
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
          npm test 2>&1 | tee "$RUNNER_TEMP/isolation.log"
          node scripts/check-skips.js "$RUNNER_TEMP/isolation.log"
