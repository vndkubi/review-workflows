name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # A JDK so the javac call-graph tests run instead of being skipped.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No dependencies to install. Tests make no network or model calls; the
      # fixture repositories need a git identity for their commits.
      - run: git config --global user.name ci && git config --global user.email ci@example.com && git config --global init.defaultBranch main
      - run: npm test
